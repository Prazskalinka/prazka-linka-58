<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Přihlášení | Pražská linka 58</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1c1c1c;
            color: white;
            text-align: center;
        }

        header {
            position: relative;
            background-color: #111111;
            min-height: 120px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        .zpet {
            position: absolute;
            left: 35px;
            top: 50%;

            transform: translateY(-50%);

            color: white;
            text-decoration: none;

            font-size: 22px;
            font-weight: bold;
        }

        .zpet:hover {
            color: #cccccc;
        }

        main {
            padding: 60px 20px;
        }

        .login-box {
            width: 500px;
            max-width: 100%;

            margin: 0 auto;

            background-color: #262626;

            padding: 40px;

            border-radius: 15px;
        }

        h2 {
            margin-top: 0;
            font-size: 30px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        input {
            width: 100%;

            padding: 15px;

            margin-top: 14px;

            border: none;
            border-radius: 8px;

            font-size: 17px;
        }

        button {
            width: 100%;

            padding: 15px;

            margin-top: 16px;

            border: none;
            border-radius: 8px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .login-button {
            background-color: #0866c6;
            color: white;
        }

        .login-button:hover {
            background-color: #0d7bea;
        }

        .register-button {
            background-color: #4b4b4b;
            color: white;
        }

        .register-button:hover {
            background-color: #5a5a5a;
        }

        .discord-button {
            background-color: #5865F2;
            color: white;
        }

        .discord-button:hover {
            background-color: #4752c4;
        }

        .logout-button {
            background-color: #b3261e;
            color: white;
        }

        .separator {
            margin: 28px 0;
            color: #aaaaaa;
        }

        #message {
            margin-top: 25px;

            min-height: 30px;

            font-size: 17px;
            line-height: 1.5;
        }

        #userPanel {
            display: none;
        }

        #userAvatar {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid white;

            margin-bottom: 15px;
        }

        #userName {
            font-size: 24px;
            font-weight: bold;
        }

        #userEmail {
            color: #cccccc;
        }

        footer {
            margin-top: 60px;

            background-color: #111111;

            padding: 25px;

            color: #cccccc;
        }
    </style>
</head>


<body>

    <header>

        <a
            href="index.html"
            class="zpet"
        >
            ← Zpět
        </a>

        <h1>Přihlášení</h1>

    </header>


    <main>

        <div class="login-box">

            <div id="loginPanel">

                <h2>Pražská linka 58</h2>

                <p>
                    Přihlaste se nebo si vytvořte nový účet.
                </p>


                <input
                    id="email"
                    type="email"
                    placeholder="E-mail"
                    autocomplete="email"
                >


                <input
                    id="password"
                    type="password"
                    placeholder="Heslo"
                    autocomplete="current-password"
                >


                <button
                    id="loginButton"
                    type="button"
                    class="login-button"
                >
                    Přihlásit se
                </button>


                <button
                    id="registerButton"
                    type="button"
                    class="register-button"
                >
                    Registrovat se
                </button>


                <div class="separator">
                    nebo
                </div>


                <button
                    id="discordButton"
                    type="button"
                    class="discord-button"
                >
                    Přihlásit se přes Discord
                </button>

            </div>


            <div id="userPanel">

                <img
                    id="userAvatar"
                    src=""
                    alt="Profilová fotka"
                >

                <div id="userName"></div>

                <p id="userEmail"></p>


                <button
                    id="logoutButton"
                    type="button"
                    class="logout-button"
                >
                    Odhlásit se
                </button>

            </div>


            <div id="message"></div>

        </div>

    </main>


    <footer>
        Pražská linka 58
    </footer>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        window.addEventListener("DOMContentLoaded", async function () {

            const SUPABASE_URL =
                "https://zhrlmmxueozrpvemuccy.supabase.co";


            const SUPABASE_KEY =
                "sb_publishable_AkMbsg_7MkYSPq9viQWJhw_b69GShS0";


            const HOME_URL =
                "https://prazskalinka.github.io/prazka-linka-58/";


            const LOGIN_URL =
                "https://prazskalinka.github.io/prazka-linka-58/prihlaseni.html";


            const message =
                document.getElementById("message");

            const loginButton =
                document.getElementById("loginButton");

            const registerButton =
                document.getElementById("registerButton");

            const discordButton =
                document.getElementById("discordButton");

            const logoutButton =
                document.getElementById("logoutButton");


            function showMessage(text, error = false) {

                message.textContent = text;

                message.style.color =
                    error ? "#ff7777" : "#7CFC98";

            }


            function setLoading(loading) {

                loginButton.disabled = loading;
                registerButton.disabled = loading;
                discordButton.disabled = loading;

            }


            if (!window.supabase) {

                showMessage(
                    "Chyba: knihovna Supabase se nenačetla.",
                    true
                );

                return;

            }


            const supabaseClient =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_KEY,
                    {
                        auth: {
                            persistSession: true,
                            autoRefreshToken: true,
                            detectSessionInUrl: true
                        }
                    }
                );


            /* =============================
               PŘIHLÁŠENÍ E-MAILEM
            ============================== */

            loginButton.addEventListener(
                "click",
                async function () {

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    if (!email || !password) {

                        showMessage(
                            "Vyplňte e-mail a heslo.",
                            true
                        );

                        return;

                    }


                    setLoading(true);

                    showMessage(
                        "Probíhá přihlášení..."
                    );


                    try {

                        const { data, error } =
                            await supabaseClient.auth
                                .signInWithPassword({
                                    email: email,
                                    password: password
                                });


                        if (error) {

                            showMessage(
                                "Přihlášení se nezdařilo: " +
                                error.message,
                                true
                            );

                            return;

                        }


                        if (data.session) {

                            showMessage(
                                "Přihlášení proběhlo úspěšně."
                            );


                            window.location.href =
                                HOME_URL;

                        }

                    }

                    catch (error) {

                        showMessage(
                            "Chyba: " +
                            error.message,
                            true
                        );

                    }

                    finally {

                        setLoading(false);

                    }

                }
            );


            /* =============================
               REGISTRACE
            ============================== */

            registerButton.addEventListener(
                "click",
                async function () {

                    const email =
                        document
                            .getElementById("email")
                            .value
                            .trim();


                    const password =
                        document
                            .getElementById("password")
                            .value;


                    if (!email || !password) {

                        showMessage(
                            "Vyplňte e-mail a heslo.",
                            true
                        );

                        return;

                    }


                    if (password.length < 6) {

                        showMessage(
                            "Heslo musí mít alespoň 6 znaků.",
                            true
                        );

                        return;

                    }


                    setLoading(true);

                    showMessage(
                        "Vytvářím účet..."
                    );


                    try {

                        const { data, error } =
                            await supabaseClient.auth
                                .signUp({

                                    email: email,

                                    password: password,

                                    options: {
                                        emailRedirectTo:
                                            LOGIN_URL
                                    }

                                });


                        if (error) {

                            showMessage(
                                "Registrace se nezdařila: " +
                                error.message,
                                true
                            );

                            return;

                        }


                        if (data.session) {

                            showMessage(
                                "Účet byl vytvořen."
                            );


                            window.location.href =
                                HOME_URL;

                        }

                        else {

                            showMessage(
                                "Účet byl vytvořen. Teď otevřete e-mail a potvrďte registraci."
                            );

                        }

                    }

                    catch (error) {

                        showMessage(
                            "Chyba: " +
                            error.message,
                            true
                        );

                    }

                    finally {

                        setLoading(false);

                    }

                }
            );


            /* =============================
               DISCORD
            ============================== */

            discordButton.addEventListener(
                "click",
                async function () {

                    setLoading(true);

                    showMessage(
                        "Přesměrovávám na Discord..."
                    );


                    try {

                        const { error } =
                            await supabaseClient.auth
                                .signInWithOAuth({

                                    provider: "discord",

                                    options: {
                                        redirectTo:
                                            HOME_URL
                                    }

                                });


                        if (error) {

                            showMessage(
                                "Discord přihlášení se nezdařilo: " +
                                error.message,
                                true
                            );

                            setLoading(false);

                        }

                    }

                    catch (error) {

                        showMessage(
                            "Chyba: " +
                            error.message,
                            true
                        );

                        setLoading(false);

                    }

                }
            );


            /* =============================
               ODHLÁŠENÍ
            ============================== */

            logoutButton.addEventListener(
                "click",
                async function () {

                    await supabaseClient.auth.signOut();

                    showUser(null);

                }
            );


            /* =============================
               ZOBRAZENÍ UŽIVATELE
            ============================== */

            function showUser(session) {

                const loginPanel =
                    document.getElementById(
                        "loginPanel"
                    );


                const userPanel =
                    document.getElementById(
                        "userPanel"
                    );


                if (!session || !session.user) {

                    loginPanel.style.display =
                        "block";

                    userPanel.style.display =
                        "none";

                    return;

                }


                const user =
                    session.user;


                const metadata =
                    user.user_metadata || {};


                const name =

                    metadata.full_name ||

                    metadata.name ||

                    metadata.global_name ||

                    metadata.preferred_username ||

                    metadata.username ||

                    user.email ||

                    "Uživatel";


                const avatar =

                    metadata.avatar_url ||

                    metadata.picture ||

                    "https://cdn.discordapp.com/embed/avatars/0.png";


                document.getElementById(
                    "userName"
                ).textContent =
                    name;


                document.getElementById(
                    "userEmail"
                ).textContent =
                    user.email || "";


                document.getElementById(
                    "userAvatar"
                ).src =
                    avatar;


                loginPanel.style.display =
                    "none";


                userPanel.style.display =
                    "block";

            }


            /* =============================
               EXISTUJÍCÍ SESSION
            ============================== */

            const { data } =
                await supabaseClient.auth
                    .getSession();


            showUser(
                data.session
            );


            supabaseClient.auth
                .onAuthStateChange(
                    function (event, session) {

                        showUser(session);

                    }
                );

        });

    </script>

</body>

</html>
