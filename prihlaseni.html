<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Přihlášení | Pražská linka 58</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background-color: #1c1c1c;
            color: white;

            text-align: center;
        }

        /* HORNÍ LIŠTA */

        header {
            position: relative;

            background-color: #111111;

            min-height: 120px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        header h1 {
            margin: 0;

            font-size: 42px;
        }

        .zpet {
            position: absolute;

            left: 35px;
            top: 50%;

            transform: translateY(-50%);

            color: white;

            text-decoration: none;

            font-size: 22px;
            font-weight: bold;
        }

        .zpet:hover {
            color: #cccccc;
        }

        /* HLAVNÍ OBSAH */

        main {
            padding: 60px 20px;
        }

        .login-box {
            width: 480px;

            max-width: 100%;

            margin: 0 auto;

            background-color: #262626;

            padding: 40px;

            border-radius: 15px;
        }

        h2 {
            margin-top: 0;

            font-size: 30px;
        }

        p {
            font-size: 18px;

            line-height: 1.6;
        }

        /* POLÍČKA */

        input {
            width: 100%;

            padding: 15px;

            margin-top: 14px;

            border: none;

            border-radius: 8px;

            font-size: 17px;
        }

        /* TLAČÍTKA */

        button {
            width: 100%;

            padding: 15px;

            margin-top: 16px;

            border: none;

            border-radius: 8px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button {
            background-color: #0866c6;
            color: white;
        }

        .login-button:hover {
            background-color: #0d7bea;
        }

        .register-button {
            background-color: #444444;
            color: white;
        }

        .register-button:hover {
            background-color: #555555;
        }

        .discord-button {
            background-color: #5865F2;
            color: white;
        }

        .discord-button:hover {
            background-color: #4752c4;
        }

        .home-button {
            background-color: #0866c6;
            color: white;
        }

        .logout-button {
            background-color: #b3261e;
            color: white;
        }

        /* ODDĚLOVAČ */

        .separator {
            margin: 28px 0;

            color: #aaaaaa;
        }

        /* ZPRÁVA */

        #message {
            margin-top: 25px;

            min-height: 28px;

            font-size: 17px;

            line-height: 1.5;
        }

        /* PŘIHLÁŠENÝ UŽIVATEL */

        #userPanel {
            display: none;
        }

        #userAvatar {
            width: 90px;
            height: 90px;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid white;

            margin-bottom: 15px;
        }

        #userName {
            font-size: 24px;

            font-weight: bold;

            margin-bottom: 5px;
        }

        #userEmail {
            color: #cccccc;
        }

        /* PATIČKA */

        footer {
            margin-top: 60px;

            background-color: #111111;

            padding: 25px;

            color: #cccccc;
        }

        /* MOBIL */

        @media (max-width: 700px) {

            header {
                padding: 25px 15px 80px 15px;
            }

            header h1 {
                font-size: 30px;
            }

            .zpet {
                top: auto;

                bottom: 20px;

                left: 50%;

                transform: translateX(-50%);
            }

            main {
                padding: 40px 15px;
            }

            .login-box {
                padding: 25px;
            }

        }

    </style>

</head>


<body>

    <!-- HORNÍ LIŠTA -->

    <header>

        <a
            href="index.html"
            class="zpet"
        >
            ← Zpět
        </a>

        <h1>Přihlášení</h1>

    </header>


    <!-- HLAVNÍ OBSAH -->

    <main>

        <div class="login-box">


            <!-- NEPŘIHLÁŠENÝ UŽIVATEL -->

            <div id="loginPanel">

                <h2>Pražská linka 58</h2>

                <p>
                    Přihlaste se nebo si vytvořte nový účet.
                </p>


                <input
                    type="email"
                    id="email"
                    placeholder="E-mail"
                    autocomplete="email"
                >


                <input
                    type="password"
                    id="password"
                    placeholder="Heslo"
                    autocomplete="current-password"
                >


                <button
                    class="login-button"
                    onclick="loginEmail()"
                >
                    Přihlásit se
                </button>


                <button
                    class="register-button"
                    onclick="registerEmail()"
                >
                    Registrovat se
                </button>


                <div class="separator">
                    nebo
                </div>


                <button
                    class="discord-button"
                    onclick="loginDiscord()"
                >
                    Přihlásit se přes Discord
                </button>

            </div>


            <!-- PŘIHLÁŠENÝ UŽIVATEL -->

            <div id="userPanel">

                <img
                    id="userAvatar"
                    src=""
                    alt="Profilová fotka"
                >

                <div id="userName">
                    Přihlášený uživatel
                </div>

                <p id="userEmail"></p>


                <button
                    class="home-button"
                    onclick="goHome()"
                >
                    Přejít na hlavní stránku
                </button>


                <button
                    class="logout-button"
                    onclick="logoutUser()"
                >
                    Odhlásit se
                </button>

            </div>


            <div id="message"></div>

        </div>

    </main>


    <!-- PATIČKA -->

    <footer>
        Pražská linka 58
    </footer>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* =========================================
           SUPABASE NASTAVENÍ
        ========================================== */

        const SUPABASE_URL =
            "https://zhrlmmxueozrpvemuccy.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_AkMbsg_7MkYSPq9viQWJhw_b69GShS0";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY,
                {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                }
            );


        /* =========================================
           ADRESY
        ========================================== */

        const HOME_URL =
            "https://prazskalinka.github.io/prazka-linka-58/";

        const LOGIN_URL =
            "https://prazskalinka.github.io/prazka-linka-58/prihlaseni.html";


        /* =========================================
           ZPRÁVY
        ========================================== */

        function showMessage(text, isError = false) {

            const message =
                document.getElementById("message");


            message.textContent =
                text;


            if (isError) {

                message.style.color =
                    "#ff7777";

            } else {

                message.style.color =
                    "#7CFC98";

            }

        }


        /* =========================================
           REGISTRACE E-MAILEM
        ========================================== */

        async function registerEmail() {

            const email =
                document.getElementById("email")
                .value
                .trim();


            const password =
                document.getElementById("password")
                .value;


            if (!email || !password) {

                showMessage(
                    "Vyplňte e-mail a heslo.",
                    true
                );

                return;

            }


            if (password.length < 6) {

                showMessage(
                    "Heslo musí mít alespoň 6 znaků.",
                    true
                );

                return;

            }


            showMessage(
                "Probíhá registrace..."
            );


            const { data, error } =
                await supabaseClient.auth
                .signUp({

                    email: email,

                    password: password,

                    options: {

                        emailRedirectTo:
                            HOME_URL

                    }

                });


            if (error) {

                showMessage(
                    "Registrace se nezdařila: " +
                    error.message,
                    true
                );

                return;

            }


            if (data.session) {

                showMessage(
                    "Registrace proběhla úspěšně."
                );


                window.location.href =
                    HOME_URL;

            } else {

                showMessage(
                    "Registrace proběhla. Zkontrolujte svůj e-mail a potvrďte účet."
                );

            }

        }


        /* =========================================
           PŘIHLÁŠENÍ E-MAILEM
        ========================================== */

        async function loginEmail() {

            const email =
                document.getElementById("email")
                .value
                .trim();


            const password =
                document.getElementById("password")
                .value;


            if (!email || !password) {

                showMessage(
                    "Vyplňte e-mail a heslo.",
                    true
                );

                return;

            }


            showMessage(
                "Probíhá přihlášení..."
            );


            const { data, error } =
                await supabaseClient.auth
                .signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                showMessage(
                    "Přihlášení se nezdařilo: " +
                    error.message,
                    true
                );

                return;

            }


            if (data.session) {

                window.location.href =
                    HOME_URL;

            }

        }


        /* =========================================
           DISCORD
        ========================================== */

        async function loginDiscord() {

            showMessage(
                "Přesměrovávám na Discord..."
            );


            const { error } =
                await supabaseClient.auth
                .signInWithOAuth({

                    provider: "discord",

                    options: {

                        redirectTo:
                            HOME_URL

                    }

                });


            if (error) {

                showMessage(
                    "Discord přihlášení se nezdařilo: " +
                    error.message,
                    true
                );

            }

        }


        /* =========================================
           ZOBRAZENÍ UŽIVATELE
        ========================================== */

        function showUser(session) {

            const loginPanel =
                document.getElementById(
                    "loginPanel"
                );


            const userPanel =
                document.getElementById(
                    "userPanel"
                );


            if (!session || !session.user) {

                loginPanel.style.display =
                    "block";


                userPanel.style.display =
                    "none";


                return;

            }


            const user =
                session.user;


            const metadata =
                user.user_metadata || {};


            const name =

                metadata.full_name ||

                metadata.name ||

                metadata.global_name ||

                metadata.preferred_username ||

                metadata.user_name ||

                metadata.username ||

                user.email ||

                "Přihlášený uživatel";


            const avatar =

                metadata.avatar_url ||

                metadata.picture ||

                "";


            document.getElementById(
                "userName"
            ).textContent =
                name;


            document.getElementById(
                "userEmail"
            ).textContent =
                user.email || "";


            if (
                avatar &&
                avatar.startsWith("http")
            ) {

                document.getElementById(
                    "userAvatar"
                ).src =
                    avatar;

            } else {

                document.getElementById(
                    "userAvatar"
                ).src =
                    "https://cdn.discordapp.com/embed/avatars/0.png";

            }


            loginPanel.style.display =
                "none";


            userPanel.style.display =
                "block";

        }


        /* =========================================
           ODHLÁŠENÍ
        ========================================== */

        async function logoutUser() {

            const { error } =
                await supabaseClient.auth
                .signOut();


            if (error) {

                showMessage(
                    "Odhlášení se nezdařilo.",
                    true
                );

                return;

            }


            showUser(null);


            showMessage(
                "Byl jste odhlášen."
            );

        }


        /* =========================================
           HLAVNÍ STRÁNKA
        ========================================== */

        function goHome() {

            window.location.href =
                HOME_URL;

        }


        /* =========================================
           KONTROLA PŘIHLÁŠENÍ
        ========================================== */

        async function checkLogin() {

            const { data, error } =
                await supabaseClient.auth
                .getSession();


            if (error) {

                console.error(
                    error
                );

                return;

            }


            showUser(
                data.session
            );

        }


        /* =========================================
           ZMĚNA PŘIHLÁŠENÍ
        ========================================== */

        supabaseClient.auth.onAuthStateChange(

            function(event, session) {

                showUser(
                    session
                );

            }

        );


        /* SPUSTIT */

        checkLogin();

    </script>

</body>

</html>
