<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Přihlášení | Pražská linka 58</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1c1c1c;
            color: white;
            text-align: center;
        }

        /* HORNÍ LIŠTA */

        header {
            position: relative;
            background-color: #111111;
            min-height: 120px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        .zpet {
            position: absolute;
            left: 35px;
            top: 50%;

            transform: translateY(-50%);

            color: white;
            text-decoration: none;

            font-size: 22px;
            font-weight: bold;
        }

        .zpet:hover {
            color: #cccccc;
        }

        /* HLAVNÍ OBSAH */

        main {
            padding: 60px 20px;
        }

        .login-box {
            width: 500px;
            max-width: 100%;

            margin: 0 auto;

            background-color: #262626;

            padding: 40px;

            border-radius: 15px;
        }

        h2 {
            margin-top: 0;
            font-size: 30px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
        }

        /* POLÍČKA */

        input {
            width: 100%;

            padding: 15px;

            margin-top: 14px;

            border: none;
            border-radius: 8px;

            font-size: 17px;
        }

        /* TLAČÍTKA */

        button {
            width: 100%;

            padding: 15px;

            margin-top: 16px;

            border: none;
            border-radius: 8px;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button {
            background-color: #0866c6;
            color: white;
        }

        .login-button:hover {
            background-color: #0d7bea;
        }

        .register-button {
            background-color: #4b4b4b;
            color: white;
        }

        .register-button:hover {
            background-color: #5c5c5c;
        }

        .discord-button {
            background-color: #5865F2;
            color: white;
        }

        .discord-button:hover {
            background-color: #4752c4;
        }

        .logout-button {
            background-color: #b3261e;
            color: white;
        }

        .logout-button:hover {
            background-color: #d93025;
        }

        /* ODDĚLOVAČ */

        .separator {
            margin: 28px 0;
            color: #aaaaaa;
        }

        /* ZPRÁVA */

        #message {
            margin-top: 25px;
            min-height: 28px;

            font-size: 17px;
        }

        /* PŘIHLÁŠENÝ UŽIVATEL */

        #userPanel {
            display: none;
        }

        #userName {
            font-size: 25px;
            font-weight: bold;

            margin-bottom: 8px;
        }

        #userEmail {
            color: #cccccc;
        }

        /* PATIČKA */

        footer {
            margin-top: 60px;

            background-color: #111111;

            padding: 25px;

            color: #cccccc;
        }

        /* MOBIL */

        @media (max-width: 700px) {

            header {
                padding: 25px 15px 80px 15px;
            }

            header h1 {
                font-size: 30px;
            }

            .zpet {
                top: auto;
                bottom: 20px;

                left: 50%;
                transform: translateX(-50%);
            }

            main {
                padding: 40px 15px;
            }

            .login-box {
                padding: 25px;
            }
        }
    </style>
</head>


<body>

    <!-- HORNÍ LIŠTA -->

    <header>

        <a href="index.html" class="zpet">
            ← Zpět
        </a>

        <h1>Přihlášení</h1>

    </header>


    <!-- HLAVNÍ ČÁST -->

    <main>

        <div class="login-box">

            <!-- NEPŘIHLÁŠENÝ -->

            <div id="loginPanel">

                <h2>Pražská linka 58</h2>

                <p>
                    Přihlaste se nebo si vytvořte nový účet.
                </p>


                <input
                    type="email"
                    id="email"
                    placeholder="E-mail"
                    autocomplete="email"
                >


                <input
                    type="password"
                    id="password"
                    placeholder="Heslo"
                    autocomplete="current-password"
                >


                <button
                    class="login-button"
                    onclick="loginEmail()"
                >
                    Přihlásit se
                </button>


                <button
                    class="register-button"
                    onclick="registerEmail()"
                >
                    Registrovat se
                </button>


                <div class="separator">
                    nebo
                </div>


                <button
                    class="discord-button"
                    onclick="loginDiscord()"
                >
                    Přihlásit se přes Discord
                </button>

            </div>


            <!-- PŘIHLÁŠENÝ -->

            <div id="userPanel">

                <h2>Jste přihlášen</h2>

                <div id="userName">
                    Přihlášený uživatel
                </div>

                <p id="userEmail"></p>

                <button
                    class="logout-button"
                    onclick="logoutUser()"
                >
                    Odhlásit se
                </button>

            </div>


            <div id="message"></div>

        </div>

    </main>


    <footer>
        Pražská linka 58
    </footer>


    <!-- SUPABASE KNIHOVNA -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        /* ======================================================
           1. NASTAVENÍ SUPABASE
        ====================================================== */

        const SUPABASE_URL =
            "https://zhrlmmxueozrpvemuccy.supabase.co";


        /*
        ==========================================================
        SEM VLOŽ SVŮJ PUBLISHABLE KEY ZE SUPABASE

        Začíná:

        sb_publishable_...

        NEVKLÁDEJ SECRET KEY!
        ==========================================================
        */

        const SUPABASE_PUBLISHABLE_KEY =
            "SEM_VLOZ_SVUJ_PUBLISHABLE_KEY";


        const supabaseClient =
            window.supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY,
                {
                    auth: {
                        persistSession: true,
                        autoRefreshToken: true,
                        detectSessionInUrl: true
                    }
                }
            );


        /* ======================================================
           2. ADRESA STRÁNKY
        ====================================================== */

        const LOGIN_URL =
            "https://prazskalinka.github.io/prazka-linka-58/prihlaseni.html";


        /* ======================================================
           3. ZPRÁVY
        ====================================================== */

        function showMessage(text, isError = false) {

            const message =
                document.getElementById("message");

            message.textContent = text;

            if (isError) {

                message.style.color = "#ff7777";

            } else {

                message.style.color = "#7CFC98";

            }
        }


        /* ======================================================
           4. REGISTRACE E-MAILEM
        ====================================================== */

        async function registerEmail() {

            const email =
                document.getElementById("email")
                .value
                .trim();


            const password =
                document.getElementById("password")
                .value;


            if (!email || !password) {

                showMessage(
                    "Vyplňte e-mail a heslo.",
                    true
                );

                return;
            }


            if (password.length < 6) {

                showMessage(
                    "Heslo musí mít alespoň 6 znaků.",
                    true
                );

                return;
            }


            showMessage("Probíhá registrace...");


            try {

                const { data, error } =
                    await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {
                            emailRedirectTo: LOGIN_URL
                        }

                    });


                if (error) {

                    showMessage(
                        "Registrace se nezdařila: " +
                        error.message,
                        true
                    );

                    return;
                }


                if (data.session) {

                    showMessage(
                        "Registrace proběhla úspěšně."
                    );

                    showUser(data.session);

                } else {

                    showMessage(
                        "Registrace proběhla. Zkontrolujte e-mail a potvrďte svůj účet."
                    );

                }

            }

            catch (error) {

                showMessage(
                    "Chyba registrace: " +
                    error.message,
                    true
                );

            }

        }


        /* ======================================================
           5. PŘIHLÁŠENÍ E-MAILEM
        ====================================================== */

        async function loginEmail() {

            const email =
                document.getElementById("email")
                .value
                .trim();


            const password =
                document.getElementById("password")
                .value;


            if (!email || !password) {

                showMessage(
                    "Vyplňte e-mail a heslo.",
                    true
                );

                return;
            }


            showMessage(
                "Probíhá přihlášení..."
            );


            try {

                const { data, error } =
                    await supabaseClient.auth
                    .signInWithPassword({

                        email: email,
                        password: password

                    });


                if (error) {

                    showMessage(
                        "Přihlášení se nezdařilo: " +
                        error.message,
                        true
                    );

                    return;
                }


                showMessage(
                    "Přihlášení proběhlo úspěšně."
                );


                showUser(
                    data.session
                );

            }

            catch (error) {

                showMessage(
                    "Chyba při přihlášení: " +
                    error.message,
                    true
                );

            }

        }


        /* ======================================================
           6. PŘIHLÁŠENÍ PŘES DISCORD
        ====================================================== */

        async function loginDiscord() {

            showMessage(
                "Přesměrovávám na Discord..."
            );


            try {

                const { data, error } =
                    await supabaseClient.auth
                    .signInWithOAuth({

                        provider: "discord",

                        options: {

                            redirectTo: LOGIN_URL

                        }

                    });


                if (error) {

                    showMessage(
                        "Discord přihlášení se nezdařilo: " +
                        error.message,
                        true
                    );

                }

            }

            catch (error) {

                showMessage(
                    "Chyba při přihlášení přes Discord: " +
                    error.message,
                    true
                );

            }

        }


        /* ======================================================
           7. ODHLÁŠENÍ
        ====================================================== */

        async function logoutUser() {

            showMessage(
                "Odhlášení..."
            );


            const { error } =
                await supabaseClient.auth
                .signOut();


            if (error) {

                showMessage(
                    "Odhlášení se nezdařilo: " +
                    error.message,
                    true
                );

                return;
            }


            document.getElementById(
                "loginPanel"
            ).style.display = "block";


            document.getElementById(
                "userPanel"
            ).style.display = "none";


            showMessage(
                "Byl jste odhlášen."
            );

        }


        /* ======================================================
           8. ZOBRAZENÍ PŘIHLÁŠENÉHO UŽIVATELE
        ====================================================== */

        function showUser(session) {

            if (!session || !session.user) {

                document.getElementById(
                    "loginPanel"
                ).style.display = "block";


                document.getElementById(
                    "userPanel"
                ).style.display = "none";


                return;
            }


            const user =
                session.user;


            const metadata =
                user.user_metadata || {};


            const name =
                metadata.full_name ||
                metadata.name ||
                metadata.global_name ||
                metadata.preferred_username ||
                metadata.user_name ||
                metadata.username ||
                "Přihlášený uživatel";


            document.getElementById(
                "userName"
            ).textContent = name;


            document.getElementById(
                "userEmail"
            ).textContent =
                user.email || "";


            document.getElementById(
                "loginPanel"
            ).style.display = "none";


            document.getElementById(
                "userPanel"
            ).style.display = "block";

        }


        /* ======================================================
           9. KONTROLA PŘIHLÁŠENÍ PŘI OTEVŘENÍ STRÁNKY
        ====================================================== */

        async function checkLogin() {

            const { data, error } =
                await supabaseClient.auth
                .getSession();


            if (error) {

                showMessage(
                    "Nepodařilo se zkontrolovat přihlášení.",
                    true
                );

                return;
            }


            showUser(
                data.session
            );

        }


        /* ======================================================
           10. SLEDOVÁNÍ PŘIHLÁŠENÍ
        ====================================================== */

        supabaseClient.auth.onAuthStateChange(

            function(event, session) {

                showUser(session);

            }

        );


        /* SPUSTIT */

        checkLogin();

    </script>

</body>

</html>
