<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Přihlášení | Pražská linka 58</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1c1c1c;
            color: white;
            text-align: center;
        }

        header {
            position: relative;
            background-color: #111111;
            min-height: 120px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 42px;
        }

        .zpet {
            position: absolute;
            left: 35px;
            top: 50%;

            transform: translateY(-50%);

            color: white;
            text-decoration: none;

            font-size: 22px;
            font-weight: bold;
        }

        .zpet:hover {
            color: #cccccc;
        }

        main {
            padding: 70px 20px;
        }

        .login-box {
            width: 500px;
            max-width: 100%;

            margin: 0 auto;

            background-color: #262626;

            padding: 45px;

            border-radius: 16px;
        }

        h2 {
            margin-top: 0;
            font-size: 32px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #dddddd;
        }

        /* DISCORD */

        .discord-button {
            width: 100%;

            padding: 17px;

            margin-top: 25px;

            border: none;
            border-radius: 9px;

            background-color: #5865F2;
            color: white;

            font-size: 19px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .discord-button:hover {
            background-color: #4752c4;
            transform: scale(1.02);
        }

        .discord-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        /* UŽIVATEL */

        #userPanel {
            display: none;
        }

        #userAvatar {
            width: 100px;
            height: 100px;

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid white;

            margin-bottom: 18px;
        }

        #userName {
            font-size: 25px;
            font-weight: bold;

            margin-bottom: 8px;
        }

        #userEmail {
            font-size: 16px;
            color: #bbbbbb;
        }

        .home-button,
        .logout-button {
            width: 100%;

            padding: 15px;

            margin-top: 15px;

            border: none;
            border-radius: 8px;

            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        .home-button {
            background-color: #0866c6;
        }

        .home-button:hover {
            background-color: #0d7bea;
        }

        .logout-button {
            background-color: #b3261e;
        }

        .logout-button:hover {
            background-color: #cf3027;
        }

        /* ZPRÁVA */

        #message {
            margin-top: 25px;

            min-height: 30px;

            font-size: 17px;
        }

        footer {
            margin-top: 60px;

            background-color: #111111;

            padding: 25px;

            color: #cccccc;
        }

        @media (max-width: 700px) {

            header {
                padding: 25px 15px 80px 15px;
            }

            header h1 {
                font-size: 30px;
            }

            .zpet {
                top: auto;
                bottom: 20px;
                left: 50%;

                transform: translateX(-50%);
            }

            .login-box {
                padding: 30px 25px;
            }

        }
    </style>
</head>


<body>

    <header>

        <a href="index.html" class="zpet">
            ← Zpět
        </a>

        <h1>Přihlášení</h1>

    </header>


    <main>

        <div class="login-box">

            <!-- NEPŘIHLÁŠENÝ -->

            <div id="loginPanel">

                <h2>Pražská linka 58</h2>

                <p>
                    Přihlaste se nebo si vytvořte účet pomocí Discordu.
                </p>

                <button
                    id="discordButton"
                    class="discord-button"
                    type="button"
                >
                    Přihlásit se přes Discord
                </button>

            </div>


            <!-- PŘIHLÁŠENÝ -->

            <div id="userPanel">

                <img
                    id="userAvatar"
                    src=""
                    alt="Discord profilová fotka"
                >

                <div id="userName">
                    Uživatel
                </div>

                <div id="userEmail"></div>


                <button
                    id="homeButton"
                    class="home-button"
                    type="button"
                >
                    Přejít na hlavní stránku
                </button>


                <button
                    id="logoutButton"
                    class="logout-button"
                    type="button"
                >
                    Odhlásit se
                </button>

            </div>


            <div id="message"></div>

        </div>

    </main>


    <footer>
        Pražská linka 58
    </footer>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        window.addEventListener(
            "DOMContentLoaded",
            async function () {

                /* ============================
                   SUPABASE
                ============================ */

                const SUPABASE_URL =
                    "https://zhrlmmxueozrpvemuccy.supabase.co";


                const SUPABASE_KEY =
                    "sb_publishable_AkMbsg_7MkYSPq9viQWJhw_b69GShS0";


                const HOME_URL =
                    "https://prazskalinka.github.io/prazka-linka-58/";


                const supabaseClient =
                    window.supabase.createClient(
                        SUPABASE_URL,
                        SUPABASE_KEY,
                        {
                            auth: {
                                persistSession: true,
                                autoRefreshToken: true,
                                detectSessionInUrl: true
                            }
                        }
                    );


                /* ============================
                   PRVKY
                ============================ */

                const loginPanel =
                    document.getElementById("loginPanel");


                const userPanel =
                    document.getElementById("userPanel");


                const discordButton =
                    document.getElementById("discordButton");


                const logoutButton =
                    document.getElementById("logoutButton");


                const homeButton =
                    document.getElementById("homeButton");


                const message =
                    document.getElementById("message");


                /* ============================
                   ZPRÁVA
                ============================ */

                function showMessage(text, error = false) {

                    message.textContent = text;

                    message.style.color =
                        error ? "#ff7777" : "#7CFC98";

                }


                /* ============================
                   DISCORD LOGIN
                ============================ */

                discordButton.addEventListener(
                    "click",
                    async function () {

                        discordButton.disabled = true;

                        showMessage(
                            "Přesměrovávám na Discord..."
                        );


                        const { error } =
                            await supabaseClient.auth
                                .signInWithOAuth({

                                    provider: "discord",

                                    options: {

                                        redirectTo:
                                            HOME_URL

                                    }

                                });


                        if (error) {

                            showMessage(
                                "Přihlášení přes Discord se nezdařilo: " +
                                error.message,
                                true
                            );

                            discordButton.disabled = false;

                        }

                    }
                );


                /* ============================
                   ZOBRAZENÍ UŽIVATELE
                ============================ */

                function showUser(session) {

                    if (!session || !session.user) {

                        loginPanel.style.display =
                            "block";

                        userPanel.style.display =
                            "none";

                        return;

                    }


                    const user =
                        session.user;


                    const metadata =
                        user.user_metadata || {};


                    const name =

                        metadata.global_name ||

                        metadata.full_name ||

                        metadata.name ||

                        metadata.preferred_username ||

                        metadata.user_name ||

                        metadata.username ||

                        "Discord uživatel";


                    const avatar =

                        metadata.avatar_url ||

                        metadata.picture ||

                        "https://cdn.discordapp.com/embed/avatars/0.png";


                    document.getElementById(
                        "userName"
                    ).textContent =
                        name;


                    document.getElementById(
                        "userEmail"
                    ).textContent =
                        user.email || "";


                    document.getElementById(
                        "userAvatar"
                    ).src =
                        avatar;


                    loginPanel.style.display =
                        "none";


                    userPanel.style.display =
                        "block";

                }


                /* ============================
                   HLAVNÍ STRÁNKA
                ============================ */

                homeButton.addEventListener(
                    "click",
                    function () {

                        window.location.href =
                            HOME_URL;

                    }
                );


                /* ============================
                   ODHLÁŠENÍ
                ============================ */

                logoutButton.addEventListener(
                    "click",
                    async function () {

                        const { error } =
                            await supabaseClient.auth
                                .signOut();


                        if (error) {

                            showMessage(
                                "Odhlášení se nezdařilo.",
                                true
                            );

                            return;

                        }


                        showUser(null);

                        showMessage(
                            "Byl jste odhlášen."
                        );

                    }
                );


                /* ============================
                   KONTROLA SESSION
                ============================ */

                const { data, error } =
                    await supabaseClient.auth
                        .getSession();


                if (error) {

                    console.error(error);

                } else {

                    showUser(
                        data.session
                    );

                }


                /* ============================
                   SLEDOVÁNÍ PŘIHLÁŠENÍ
                ============================ */

                supabaseClient.auth
                    .onAuthStateChange(

                        function (event, session) {

                            showUser(session);

                        }

                    );

            }
        );

    </script>

</body>

</html>
