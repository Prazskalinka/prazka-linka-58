<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>O autorovi | Pražská linka 58</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1c1c1c;
            color: white;
            text-align: center;
        }

        header {
            position: relative;
            background-color: #111111;
            min-height: 120px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px 180px;
        }

        header h1 {
            margin: 0;
            font-size: 44px;
        }

        .zpet-button {
            position: absolute;
            left: 35px;
            top: 50%;

            transform: translateY(-50%);

            background-color: #0866c6;
            color: white;

            text-decoration: none;

            font-size: 18px;
            font-weight: bold;

            padding: 14px 24px;

            border-radius: 8px;

            transition: 0.2s;
        }

        .zpet-button:hover {
            background-color: #0d7bea;
            transform: translateY(-50%) scale(1.04);
        }

        .obsah {
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 30px;
        }

        h2 {
            font-size: 32px;
            margin-bottom: 30px;
        }

        p {
            font-size: 20px;
            line-height: 1.7;
        }

        .karta {
            background-color: #262626;

            padding: 35px;

            border-radius: 15px;

            margin-top: 30px;
        }

        .karta h3 {
            font-size: 26px;
            margin-top: 0;
        }

        footer {
            margin-top: 60px;

            background-color: #111111;

            padding: 25px;

            font-size: 15px;
        }

        @media (max-width: 800px) {

            header {
                padding: 25px 20px 85px 20px;
            }

            header h1 {
                font-size: 32px;
            }

            .zpet-button {
                top: auto;
                bottom: 18px;
                left: 50%;

                transform: translateX(-50%);
            }

            .zpet-button:hover {
                transform: translateX(-50%) scale(1.04);
            }

            p {
                font-size: 18px;
            }
        }
    </style>
</head>


<body>

    <header>

        <a
            class="zpet-button"
            href="index.html"
        >
            ← Zpět
        </a>

        <h1>O autorovi</h1>

    </header>


    <main class="obsah">

        <h2>Pražská linka 58</h2>

        <div class="karta">

            <h3>Autor projektu</h3>

            <p>
                Vítejte na stránce projektu Pražská linka 58.
            </p>

            <p>
                Tento web a launcher vznikly jako projekt zaměřený
                na Pražskou linku 58 a obsah pro OMSI 2.
            </p>

            <p>
                Na stránce najdete informace o projektu,
                launcher a aktualizace jednotlivých balíčků.
            </p>

        </div>

    </main>


    <footer>
        Pražská linka 58
    </footer>

</body>

</html>
